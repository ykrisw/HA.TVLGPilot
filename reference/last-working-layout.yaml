            - width: 47px
            - height: 47px
            - color: '[[[ const a=states[''sensor.lg_49nano816na_56ba_active_app'']; return a?.attributes?.app_id === ''amazon'' ? ''#ffd000'' : ''#4b8bbe''; ]]]'
            name:
            - font-size: 14px
            - font-weight: '500'
            - transform: translateY(-7px)
            grid:
            - grid-template-areas: '"i" "n"'
            - grid-template-rows: 1fr min-content
        - type: custom:button-card
