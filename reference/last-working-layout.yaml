views:
- title: TV Control
  path: overview
  icon: mdi:television-classic
  type: sections
  subview: false
  max_columns: 3
  sections:
  - type: grid
    column_span: 2
    cards:
    - type: custom:button-card
      color_type: blank-card
      tap_action:
        action: none
      styles:
        card:
        - height: 1px
        - background: transparent
        - border: none
        - box-shadow: none
        - padding: '0'
      grid_options:
        columns: 5
        rows: 1
    - type: vertical-stack
      cards:
      - type: grid
        columns: 1
        square: false
        cards:
        - type: custom:button-card
          entity: script.lg_tv_power_on_off_glasshouse_mqtt
          name: Power
          icon: mdi:power
          show_name: false
          show_icon: true
          show_state: false
          tap_action:
            action: perform-action
            perform_action: script.lg_tv_power_on_off_glasshouse_mqtt
            target: {}
          styles:
            card:
            - height: 114px
            - padding: 5px
            - border-radius: 10px
            - margin: 7px
            icon:
            - width: 47px
            - height: 47px
            - color: '#4b8bbe'
            name:
            - font-size: 14px
            - font-weight: '500'
      - type: grid
        columns: 3
        square: false
        cards:
        - type: custom:button-card
          entity: sensor.lg_49nano816na_56ba_active_app
          name: Plex
          icon: mdi:plex
          tap_action:
            action: perform-action
            perform_action: mqtt.publish
            data:
              topic: lgtv_49nano816na_56ba/command/launchApp
              payload: Plex
              qos: 0
              retain: false
          show_name: true
          show_icon: true
          show_state: false
          triggers_update:
          - sensor.lg_49nano816na_56ba_active_app
          styles:
            card:
            - height: 118px
            - padding: 5px
            - border-radius: 10px
            - margin: 7px 10px 7px 7px
            icon:
            - width: 47px
            - height: 47px
            - color: '[[[ const a=states[''sensor.lg_49nano816na_56ba_active_app'']; return a?.attributes?.app_id === ''cdp-30'' ? ''#ffd000'' : ''#4b8bbe''; ]]]'
            name:
            - font-size: 14px
            - font-weight: '500'
            - transform: translateY(-7px)
            grid:
            - grid-template-areas: '"i" "n"'
            - grid-template-rows: 1fr min-content
        - type: custom:button-card
          entity: sensor.lg_49nano816na_56ba_active_app
          name: YouTube AdFree
          icon: mdi:youtube
          tap_action:
            action: perform-action
            perform_action: mqtt.publish
