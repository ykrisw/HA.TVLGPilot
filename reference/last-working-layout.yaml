            card:
            - height: 118px
            - padding: 5px
            - border-radius: 10px
            - margin: 7px 10px 7px 7px
            icon:
            - width: 47px
            - height: 47px
            - color: '[[[ const a=states[''sensor.lg_49nano816na_56ba_active_app'']; return a?.attributes?.app_id === ''com.apple.appletv'' ? ''#ffd000'' : ''#4b8bbe''; ]]]'
            name:
            - font-size: 14px
            - font-weight: '500'
            - transform: translateY(-7px)
            grid:
            - grid-template-areas: '"i" "n"'
            - grid-template-rows: 1fr min-content
        - type: custom:button-card
          entity: sensor.lg_49nano816na_56ba_active_app
          name: CDA
          icon: mdi:movie-open
          tap_action:
            action: perform-action
            perform_action: mqtt.publish
            data:
              topic: lgtv_49nano816na_56ba/command/launchApp
              payload: pl.cda
              qos: 0
              retain: false
          show_name: true
          show_icon: true
          show_state: false
          triggers_update:
          - sensor.lg_49nano816na_56ba_active_app
          styles:
            card:
            - height: 118px
            - padding: 5px
            - border-radius: 10px
            - margin: 7px 10px 7px 10px
            icon:
            - width: 47px
            - height: 47px
            - color: '[[[ const a=states[''sensor.lg_49nano816na_56ba_active_app'']; return a?.attributes?.app_id === ''pl.cda'' ? ''#ffd000'' : ''#4b8bbe''; ]]]'
            name:
            - font-size: 14px
            - font-weight: '500'
            - transform: translateY(-7px)
            grid:
            - grid-template-areas: '"i" "n"'
            - grid-template-rows: 1fr min-content
        - type: custom:button-card
          entity: sensor.lg_49nano816na_56ba_active_app
          name: Plex Native
          icon: mdi:plex
          tap_action:
            action: perform-action
            perform_action: mqtt.publish
            data:
              topic: lgtv_49nano816na_56ba/command/launchApp
              payload: com.beb.plxnative
              qos: 0
              retain: false
          show_name: true
          show_icon: true
          show_state: false
          triggers_update:
          - sensor.lg_49nano816na_56ba_active_app
          styles:
            card:
            - height: 118px
            - padding: 5px
            - border-radius: 10px
            - margin: 7px 7px 7px 10px
            icon:
            - width: 47px
            - height: 47px
            - color: '[[[ const a=states[''sensor.lg_49nano816na_56ba_active_app'']; return a?.attributes?.app_id === ''com.beb.plxnative'' ? ''#ffd000'' : ''#4b8bbe''; ]]]'
            name:
            - font-size: 14px
            - font-weight: '500'
            - transform: translateY(-7px)
            grid:
            - grid-template-areas: '"i" "n"'
            - grid-template-rows: 1fr min-content
      - type: grid
        columns: 3
        square: false
        cards:
        - type: custom:button-card
          color_type: blank-card
          styles:
            card:
            - height: 105px
            - border: '0'
            - background: transparent
            - box-shadow: none
            - margin: 7px 10px 7px 7px
          tap_action:
            action: none
        - type: custom:button-card
          entity: button.lg_49nano816na_56ba_remote_up
          name: Up
          show_name: false
          tap_action:
            action: perform-action
            perform_action: button.press
            target:
              entity_id: button.lg_49nano816na_56ba_remote_up
          show_icon: true
          show_state: false
          styles:
            card:
            - height: 105px
            - padding: 5px
            - border-radius: 10px
            - margin: 7px 10px 7px 10px
            icon:
            - width: 42px
            - height: 42px
            - color: '#4b8bbe'
            name:
            - font-size: 20px
            - font-weight: '500'
        - type: custom:button-card
          color_type: blank-card
          styles:
            card:
            - height: 105px
            - border: '0'
            - background: transparent
            - box-shadow: none
            - margin: 7px 7px 7px 10px
          tap_action:
            action: none
        - type: custom:button-card
          entity: button.lg_49nano816na_56ba_remote_left
          name: Left
          show_name: false
          tap_action:
            action: perform-action
            perform_action: button.press
            target:
              entity_id: button.lg_49nano816na_56ba_remote_left
          show_icon: true
          show_state: false
          styles:
            card:
            - height: 105px
            - padding: 5px
            - border-radius: 10px
            - margin: 7px 10px 7px 7px
            icon:
            - width: 42px
            - height: 42px
            - color: '#4b8bbe'
            name:
            - font-size: 20px
            - font-weight: '500'
        - type: custom:button-card
          entity: button.lg_49nano816na_56ba_remote_ok
          name: OK
          show_name: true
          show_icon: false
          tap_action:
            action: perform-action
            perform_action: button.press
            target:
              entity_id: button.lg_49nano816na_56ba_remote_ok
          show_state: false
          styles:
            card:
            - height: 105px
            - padding: 5px
            - border-radius: 10px
            - margin: 7px 10px 7px 10px
            icon:
            - width: 42px
            - height: 42px
            - color: '#4b8bbe'
            name:
            - font-size: 22px
            - font-weight: '600'
            - align-self: center
            - justify-self: center
            - color: '#4b8bbe'
            grid:
            - grid-template-areas: '"n"'
            - grid-template-columns: 1fr
            - grid-template-rows: 1fr
          extra_styles: 'ha-card:active #name { color: #ffd000 !important; }'
        - type: custom:button-card
          entity: button.lg_49nano816na_56ba_remote_right
          name: Right
          show_name: false
          tap_action:
            action: perform-action
            perform_action: button.press
            target:
              entity_id: button.lg_49nano816na_56ba_remote_right
          show_icon: true
          show_state: false
          styles:
            card:
            - height: 105px
            - padding: 5px
            - border-radius: 10px
            - margin: 7px 7px 7px 10px
            icon:
            - width: 42px
            - height: 42px
            - color: '#4b8bbe'
            name:
            - font-size: 20px
            - font-weight: '500'
        - type: custom:button-card
          color_type: blank-card
          styles:
            card:
            - height: 105px
            - border: '0'
            - background: transparent
            - box-shadow: none
            - margin: 7px 10px 7px 7px
          tap_action:
            action: none
        - type: custom:button-card
          entity: button.lg_49nano816na_56ba_remote_down
          name: Down
          show_name: false
          tap_action:
            action: perform-action
            perform_action: button.press
            target:
              entity_id: button.lg_49nano816na_56ba_remote_down
          show_icon: true
          show_state: false
          styles:
            card:
            - height: 105px
            - padding: 5px
            - border-radius: 10px
            - margin: 7px 10px 7px 10px
            icon:
            - width: 42px
            - height: 42px
            - color: '#4b8bbe'
            name:
            - font-size: 20px
            - font-weight: '500'
        - type: custom:button-card
          color_type: blank-card
          styles:
            card:
            - height: 105px
            - border: '0'
            - background: transparent
            - box-shadow: none
            - margin: 7px 7px 7px 10px
          tap_action:
            action: none
      - type: grid
        columns: 3
        square: false
        cards:
        - type: custom:button-card
          entity: button.lg_49nano816na_56ba_remote_back
          name: Wstecz
          show_name: false
          tap_action:
            action: perform-action
            perform_action: button.press
            target:
              entity_id: button.lg_49nano816na_56ba_remote_back
          show_icon: true
          show_state: false
          styles:
            card:
            - height: 108px
            - padding: 5px
            - border-radius: 10px
            - margin: 7px 10px 7px 7px
            icon:
            - width: 44px
            - height: 44px
            - color: '#4b8bbe'
            name:
            - font-size: 14px
            - font-weight: '500'
            grid:
            - grid-template-areas: '"i" "n"'
            - grid-template-rows: 1fr min-content
        - type: custom:button-card
          entity: button.lg_49nano816na_56ba_remote_home
          name: Home
          show_name: false
          tap_action:
            action: perform-action
            perform_action: button.press
            target:
              entity_id: button.lg_49nano816na_56ba_remote_home
          show_icon: true
          show_state: false
          styles:
            card:
            - height: 108px
            - padding: 5px
            - border-radius: 10px
            - margin: 7px 10px 7px 10px
            icon:
            - width: 44px
            - height: 44px
            - color: '#4b8bbe'
            name:
            - font-size: 14px
            - font-weight: '500'
            grid:
            - grid-template-areas: '"i" "n"'
            - grid-template-rows: 1fr min-content
        - type: custom:button-card
          entity: sensor.lg_49nano816na_56ba_active_app
          name: INPUT
          icon: mdi:import
          show_name: false
          tap_action:
            action: perform-action
            perform_action: mqtt.publish
            data:
              topic: lgtv_49nano816na_56ba/command/launchApp
              payload: com.tvweb.inputbar
              qos: 0
              retain: false
          show_icon: true
          show_state: false
          styles:
            card:
            - height: 108px
            - padding: 5px
            - border-radius: 10px
            - margin: 7px 7px 7px 10px
            icon:
            - width: 44px
            - height: 44px
            - color: '#4b8bbe'
            - animation: "[[[\n  const a = states['sensor.lg_49nano816na_56ba_active_app'];\n  const id = String(a?.attributes?.app_id || '');\n  if (!/^com\\.webos\\.app\\.hdmi[1-9]$/i.test(id) || !a?.last_changed) return 'none';\n  const age = (Date.now() - new Date(a.last_changed).getTime()) / 1000;\n  return age >= 0 && age < 9 ? `tv-input-flash 9s linear ${-age}s 1 both` : 'none';\n]]]"
            name:
            - font-size: 14px
            - font-weight: '500'
            grid:
            - grid-template-areas: '"i" "n"'
            - grid-template-rows: 1fr min-content
          triggers_update:
          - sensor.lg_49nano816na_56ba_active_app
          extra_styles: '@keyframes tv-input-flash { 0%,55.5556% { color:#ffd000; } 100% { color:#4b8bbe; } }'
      - type: grid
        columns: 1
        square: false
        cards:
        - type: custom:button-card
          show_icon: false
          show_name: false
          show_state: false
          tap_action:
            action: none
          custom_fields:
            play:
              card:
                type: custom:button-card
                entity: sensor.lg_49nano816na_56ba_play_state
                name: Play/Pause
                icon: mdi:play-pause
                show_name: false
                tap_action:
                  action: perform-action
                  perform_action: mqtt.publish
                  data:
                    topic: lgtv_49nano816na_56ba/command/playback
                    payload: '[[[ return states[''sensor.lg_49nano816na_56ba_play_state'']?.state === ''playing'' ? ''pause'' : ''play''; ]]]'
                    qos: 0
                    retain: false
                show_icon: true
                show_state: false
                triggers_update:
                - sensor.lg_49nano816na_56ba_play_state
                styles:
                  card:
                  - height: 108px
                  - padding: 5px
                  - border-radius: 10px
                  - margin: '0'
                  - overflow: hidden
                  icon:
                  - width: 50px
                  - height: 50px
                  - color: '[[[ const s=states[''sensor.lg_49nano816na_56ba_play_state'']?.state; return [''playing'',''paused''].includes(s) ? ''#ffd000'' : ''#4b8bbe''; ]]]'
                  - animation: '[[[ return states[''sensor.lg_49nano816na_56ba_play_state'']?.state === ''paused'' ? ''tv-pause-soft 2.5s ease-in-out infinite'' : ''none''; ]]]'
                  name:
                  - font-size: 15px
                  - font-weight: '500'
                  grid:
                  - grid-template-areas: '"i" "n"'
                  - grid-template-rows: 1fr min-content
                extra_styles: '@keyframes tv-pause-soft { 0%,100% {opacity:1;} 50% {opacity:0.58;} }'
            screen:
              card:
                type: custom:button-card
                entity: switch.lg_49nano816na_56ba_display_panel
                name: Screen Off
                icon: mdi:monitor-off
                show_icon: true
                show_name: false
                show_state: false
                tap_action:
                  action: toggle
                styles:
                  card:
                  - height: 108px
                  - padding: 5px
                  - border-radius: 10px
                  - margin: '0'
                  - overflow: hidden
                  icon:
                  - width: 46px
                  - height: 46px
                  - color: '[[[ return entity?.state === ''off'' ? ''#ffd000'' : ''#4b8bbe''; ]]]'
                  name:
                  - font-size: 15px
                  - font-weight: '500'
          styles:
            card:
            - height: 108px
            - padding: '0'
            - margin: 7px
            - background: transparent
            - border: none
            - box-shadow: none
            - border-radius: '0'
            - overflow: hidden
            grid:
            - grid-template-areas: '"play screen"'
            - grid-template-columns: minmax(0, 2fr) minmax(0, 1fr)
            - grid-template-rows: 108px
            - column-gap: 20px
            - align-items: stretch
            custom_fields:
              play:
              - min-width: '0'
              - width: 100%
              screen:
              - min-width: '0'
              - width: 100%
      grid_options:
        columns: 14
        rows: auto
    - type: custom:button-card
      color_type: blank-card
      tap_action:
        action: none
      styles:
        card:
        - height: 1px
        - background: transparent
        - border: none
        - box-shadow: none
        - padding: '0'
      grid_options:
        columns: 5
        rows: 1
  cards: []