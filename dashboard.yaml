# HA.TVLGPilot 1.1.5 — power ON/OFF status, app glow -10%, state-aware highlights, orange-red functional press feedback, screen-off 6s tail. Layout sizes retained.
views:
- title: TV Control
  path: overview
  icon: mdi:television-classic
  type: sections
  subview: false
  max_columns: 3
  sections:
  - type: grid
    column_span: 2
    cards:
    - type: custom:button-card
      visibility:
      - condition: screen
        media_query: "(min-width: 600px)"
      color_type: blank-card
      tap_action:
        action: none
      styles:
        card:
        - height: 1px
        - background: transparent
        - border: none
        - box-shadow: none
        - padding: '0'
      grid_options:
        columns: 6
        rows: 1
    - type: vertical-stack
      visibility:
      - condition: screen
        media_query: "(min-width: 600px)"
      cards:
      - type: grid
        columns: 1
        square: false
        cards:
        - type: custom:button-card
          entity: script.lg_tv_power_on_off_glasshouse_mqtt
          name: Power
          icon: mdi:power
          show_name: false
          show_icon: true
          show_state: false
          tap_action:
            action: perform-action
            perform_action: script.lg_tv_power_on_off_glasshouse_mqtt
            target: {}
          custom_fields:
            status: '[[[ const value=states[''binary_sensor.lg_49nano816na_56ba_power'']?.state; const on=value===''on''; const off=value===''off''; return on || off ? `<span style="font-family:Arial,sans-serif;font-size:16px;font-weight:800;letter-spacing:0.2px;color:${on ? ''#13cb42'' : ''#ff2136''};text-shadow:0 0 7px ${on ? ''rgba(19,203,66,0.7)'' : ''rgba(255,33,54,0.45)''}">${on ? ''ON'' : ''OFF''}</span>` : ''''; ]]]'
          triggers_update:
          - binary_sensor.lg_49nano816na_56ba_power
          styles:
            card:
            - height: 101px
            - padding: '0'
            - border-radius: 18px
            - margin: 7px 4px
            - background: 'linear-gradient(145deg, #1b2532 0%, #111820 57%, #0c1219 100%)'
            - border: '1px solid #7195b7'
            - box-shadow: inset 0 1px 2px rgba(230,244,255,0.13), 0 4px 9px rgba(0,0,0,0.38)
            - box-sizing: border-box
            - overflow: hidden
            - width: 457px
            icon:
            - width: 33px
            - height: 33px
            - color: '#ff2136'
            - animation: >-
                [[[ const value=states['binary_sensor.lg_49nano816na_56ba_power']?.state;
                    if(value!=='on' && value!=='off') return 'none';
                    if(this._tvPilotPowerLast===undefined) { this._tvPilotPowerLast=value; return 'none'; }
                    if(this._tvPilotPowerLast!==value) { this._tvPilotPowerLast=value; this._tvPilotPowerUntil=Date.now()+6000; }
                    return Date.now() < (this._tvPilotPowerUntil||0) ? 'tv-power-soft 2.5s ease-in-out 2.4' : 'none'; ]]]
            custom_fields:
              status:
              - position: absolute
              - top: 9px
              - right: 14px
              - z-index: 3
            name:
            - font-size: 14px
            - font-weight: '500'
          extra_styles: '@keyframes tv-power-soft { 0%,100% {opacity:1;} 50% {opacity:0.38;} }'
      - type: grid
        columns: 3
        square: false
        cards:
        - type: custom:button-card
          entity: sensor.lg_49nano816na_56ba_active_app
          name: Plex
          icon: mdi:plex
          tap_action:
            action: perform-action
            perform_action: mqtt.publish
            data:
              topic: lgtv_49nano816na_56ba/command/launchApp
              payload: Plex
              qos: 0
              retain: false
          show_name: false
          show_icon: false
          show_state: false
          triggers_update:
          - sensor.lg_49nano816na_56ba_active_app
          - binary_sensor.lg_49nano816na_56ba_power
          styles:
            card:
            - height: 101px
            - padding: '0'
            - border-radius: 18px
            - margin: 7px 4px
            - background: '[[[ return states[''binary_sensor.lg_49nano816na_56ba_power'']?.state === ''on'' && states[''sensor.lg_49nano816na_56ba_active_app'']?.attributes?.app_id === ''cdp-30'' ? ''linear-gradient(145deg, #65571f 0%, #4a4015 57%, #2c2711 100%)'' : ''linear-gradient(145deg, #1b2532 0%, #111820 57%, #0c1219 100%)''; ]]]'
            - border: '[[[ return states[''binary_sensor.lg_49nano816na_56ba_power'']?.state === ''on'' && states[''sensor.lg_49nano816na_56ba_active_app'']?.attributes?.app_id === ''cdp-30'' ? ''1px solid #ffd000'' : ''1px solid #7195b7''; ]]]'
            - box-shadow: '[[[ return states[''binary_sensor.lg_49nano816na_56ba_power'']?.state === ''on'' && states[''sensor.lg_49nano816na_56ba_active_app'']?.attributes?.app_id === ''cdp-30'' ? ''inset 0 1px 3px rgba(255,238,150,0.30), 0 0 16px rgba(255,208,0,0.576), 0 4px 10px rgba(0,0,0,0.38)'' : ''inset 0 1px 2px rgba(230,244,255,0.13), 0 4px 9px rgba(0,0,0,0.38)''; ]]]'
            - box-sizing: border-box
