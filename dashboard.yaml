            - background: 'linear-gradient(145deg, #1b2532 0%, #111820 57%, #0c1219 100%)'
            - border: '1px solid #7195b7'
            - box-shadow: inset 0 1px 2px rgba(230,244,255,0.13), 0 4px 9px rgba(0,0,0,0.38)
