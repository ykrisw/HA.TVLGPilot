  icon: mdi:television-classic
  type: sections
  subview: false
  max_columns: 3
  sections:
  - type: grid
    column_span: 2
    cards:
    - type: custom:button-card
      color_type: blank-card
      tap_action:
        action: none
      styles:
        card:
        - height: 1px
        - background: transparent
        - border: none
        - box-shadow: none
        - padding: '0'
      grid_options:
        columns: 5
        rows: 1
